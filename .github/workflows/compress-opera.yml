name: Compress opera-proxy

on:
  schedule:
    # каждые 12 часов
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y upx-ucl curl wget jq

      - name: Check versions and compress if needed
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          MIRROR="https://sw.ext.io/ent"
          OUR_REPO="${{ github.repository }}"
          UPSTREAM_REPO="Alexey71/opera-proxy"
          mkdir -p out work

          {
            echo "skip=true"
            echo "op_ver="
            echo "op_tag="
            echo "op_name="
          } >> "$GITHUB_OUTPUT"

          # Архитектуры: путь_на_зеркале | суффикс_в_имени_ipk
          echo "== Версии на sw.ext.io =="
          : > /tmp/wanted.txt
          : > /tmp/wanted_src.txt
          OP_VER=""

          for pair in "aarch64|aarch64-3.10" "mipsel|mipsel-3.4" "mips|mips-3.4"; do
            path="${pair%%|*}"
            suffix="${pair##*|}"
            ipk=$(curl -sL "$MIRROR/$path/" \
              | grep -oE "opera-proxy_[0-9][^\"'<> ]+_${suffix}\\.ipk" \
              | sort -V | tail -1 || true)
            if [ -z "$ipk" ]; then
              echo "  skip mirror $path (пакет не найден)"
              continue
            fi
            # итоговое имя: opera-proxy_1.29.0-1_aarch64-3.10_compressed.ipk
            want="${ipk%.ipk}_compressed.ipk"
            echo "  IPK: $ipk => $want"
            echo "$want" >> /tmp/wanted.txt
            echo "${path}|${ipk}|${want}" >> /tmp/wanted_src.txt
            v=$(echo "$ipk" | sed -n 's/^opera-proxy_\([^_]*\)_.*/\1/p')
            [ -n "$v" ] && OP_VER="$v"
          done
          sort -u /tmp/wanted.txt -o /tmp/wanted.txt

          if [ -z "$OP_VER" ]; then
            echo "❌ Не удалось определить версию opera-proxy на зеркале"
            exit 1
          fi

          OP_NAME="v${OP_VER} (opera-proxy UPX)"
          # тег релиза: op-1.29.0-1
          OP_TAG=$(echo "op-${OP_VER}" | sed 's/[^a-zA-Z0-9._-]/-/g')

          echo "op_ver=$OP_VER" >> "$GITHUB_OUTPUT"
          echo "op_tag=$OP_TAG" >> "$GITHUB_OUTPUT"
          echo "op_name=$OP_NAME" >> "$GITHUB_OUTPUT"

          echo ""
          echo "== Проверка релиза «${OP_TAG}» =="
          API_JSON=$(curl -sL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OUR_REPO}/releases/tags/${OP_TAG}" || true)

          if echo "$API_JSON" | jq -e '.id' >/dev/null 2>&1; then
            echo ">>> Релиз ${OP_TAG} уже есть — пропускаем"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "  Релиза нет — собираем"

          # Changelog из upstream Alexey71/opera-proxy
          # Версия пакета: 1.29.0-1 → тег v1.29.0 (без -N revision)
          fetch_official_cl() {
            _ver_full="$1"
            _ver_base=$(echo "$_ver_full" | sed 's/-[0-9][0-9]*$//')
            _tag="v${_ver_base}"
            _url="https://github.com/${UPSTREAM_REPO}/releases/tag/${_tag}"
            _json=$(curl -sL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/releases/tags/${_tag}" || true)
            _body=$(echo "$_json" | jq -r '.body // empty' 2>/dev/null || true)
            if [ -z "$_body" ] || [ "$_body" = "null" ]; then
              _json=$(curl -sL \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${UPSTREAM_REPO}/releases/tags/${_tag}" || true)
              _body=$(echo "$_json" | jq -r '.body // empty' 2>/dev/null || true)
            fi
            if [ -z "$_body" ] || [ "$_body" = "null" ]; then
              _json=$(curl -sL \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" || true)
              _latest_tag=$(echo "$_json" | jq -r '.tag_name // empty' 2>/dev/null || true)
              _body=$(echo "$_json" | jq -r '.body // empty' 2>/dev/null || true)
              if [ -n "$_latest_tag" ]; then
                _url="https://github.com/${UPSTREAM_REPO}/releases/tag/${_latest_tag}"
              fi
            fi
            if [ -n "$_body" ] && [ "$_body" != "null" ]; then
              echo "$_body"
              echo ""
              echo "— Источник: ${_url}"
            else
              echo "Официальный changelog: ${_url}"
            fi
          }

          {
            echo "UPX-сборка **opera-proxy** из [sw.ext.io](${MIRROR})."
            echo ""
            echo "- Версия пакета: **${OP_VER}**"
            echo "- Тег: \`${OP_TAG}\`"
            echo ""
            echo "### Changelog (upstream)"
            echo ""
            fetch_official_cl "$OP_VER"
          } > release-body-op.md

          echo "skip=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "== Сборка =="
          while IFS='|' read -r path ipk want; do
            [ -n "$want" ] || continue

            echo "IPK: $ipk"
            wget -q -O "work/$ipk" "$MIRROR/$path/$ipk"
            [ -s "work/$ipk" ] || { echo "  ❌ скачивание не удалось"; continue; }

            rm -rf work/repack
            mkdir -p work/repack/control work/repack/data
            (
              cd work/repack
              tar -xzf "../$ipk"
              tar -xzf control.tar.gz -C control 2>/dev/null || true
              tar -xzf data.tar.gz -C data 2>/dev/null || true

              # Сжимаем бинарники (не shell-скрипты)
              find data -type f \( -executable -o -name 'opera-proxy' \) 2>/dev/null | while read -r f; do
                [ -f "$f" ] || continue
                head2=$(head -c 2 "$f" 2>/dev/null || true)
                [ "$head2" = "#!" ] && continue
                magic=$(head -c 4 "$f" 2>/dev/null | od -An -tx1 | tr -d ' \n' || true)
                case "$magic" in
                  7f454c46*) ;;  # ELF
                  *) continue ;;
                esac
                echo "  compress: $f"
                timeout 240 upx -9 --lzma --force "$f" 2>/dev/null \
                  || timeout 120 upx -9 --force "$f" 2>/dev/null \
                  || true
              done

              # Пересчитать Installed-Size после UPX
              NEW_SIZE=$(du -sb data 2>/dev/null | awk '{print $1}')
              if [ -n "$NEW_SIZE" ] && [ "$NEW_SIZE" -gt 0 ] 2>/dev/null; then
                OLD_SIZE=$(sed -n 's/^Installed-Size: *//p' control/control 2>/dev/null | head -1)
                echo "  Installed-Size: ${OLD_SIZE:-?} → $NEW_SIZE"
                if grep -q '^Installed-Size:' control/control 2>/dev/null; then
                  sed -i "s/^Installed-Size: .*/Installed-Size: $NEW_SIZE/" control/control
                else
                  echo "Installed-Size: $NEW_SIZE" >> control/control
                fi
              fi

              tar -czf control.tar.gz -C control .
              tar -czf data.tar.gz -C data .
              echo "2.0" > debian-binary
              tar -czf "../../out/$want" debian-binary control.tar.gz data.tar.gz
            )
            ls -lh "out/$want" 2>/dev/null || echo "  ⚠ не собран: $want"
          done < /tmp/wanted_src.txt

          echo ""
          echo "== Результат сборки =="
          ls -lh out/ 2>/dev/null || true

          HAS=0
          ls out/*.ipk >/dev/null 2>&1 && HAS=1
          if [ "$HAS" -eq 0 ]; then
            echo ">>> Нет собранных файлов — публикация отменена"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.build.outputs.skip != 'true' && steps.build.outputs.op_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build.outputs.op_tag }}
          name: ${{ steps.build.outputs.op_name }}
          body_path: release-body-op.md
          files: out/*
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
